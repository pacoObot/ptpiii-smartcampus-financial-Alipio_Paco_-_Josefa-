<!doctype html>
<html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercício 1 — Diagrama financeiro e integrações</title><style>body{margin:0;background:#f4f7fc}main{max-width:1800px;margin:auto}svg{width:100%;height:auto}nav{padding:16px;font:16px Arial}a{color:#334867;margin-right:24px}@page{size:A3 portrait;margin:8mm}@media print{nav{display:none}}</style><nav><a href="atributos-e-relacoes.md">Atributos e relações</a><a href="../integracao-modulos-academicos.md">Contratos académicos</a><a href="diagrama-financeiro.svg">Abrir SVG</a></nav><main><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2960" viewBox="0 0 1800 2960" role="img" aria-labelledby="diagramTitle diagramDesc"><title id="diagramTitle">Gestão Financeira: entidades e integração entre módulos</title><desc id="diagramDesc">Avaliações consulta a regularidade financeira. ACTIVE permite consultar notas; BLOCKED impede a consulta; uma falha mantém a verificação indisponível. Inclui Estudantes e Docentes, Horários, Notificações e o modelo relacional financeiro.</desc><rect width="1800" height="2960" fill="#f4f7fc"/><defs><marker id="apiArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526987"/></marker></defs><text x="60" y="58" style="font-family:Arial,sans-serif;font-size:34px;fill:#172b46;font-weight:bold">Integração entre módulos · acesso às notas</text><text x="60" y="96" style="font-family:Arial,sans-serif;font-size:21px;fill:#172b46;font-weight:normal">Proposta de contratos · setas tracejadas = comunicação lógica por API, não FK na base de dados</text><rect x="60" y="150" width="500" height="180" rx="14" fill="white" stroke="#334867" stroke-width="2"/><text x="82" y="187" style="font-family:Arial,sans-serif;font-size:25px;fill:#334867;font-weight:bold">Estudantes e Docentes</text><text x="82" y="227" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Identidade académica → User.id do Core</text><text x="82" y="257" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Estudante: titular das dívidas</text><text x="82" y="287" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Docente: responsável pela sessão</text><rect x="690" y="150" width="470" height="180" rx="14" fill="white" stroke="#167c80" stroke-width="2"/><text x="712" y="187" style="font-family:Arial,sans-serif;font-size:25px;fill:#167c80;font-weight:bold">Financeiro</text><text x="712" y="227" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Debt · Payment · FinancialStatus</text><text x="712" y="257" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Fornece regularidade: ACTIVE / BLOCKED</text><text x="712" y="287" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Gere taxas e confirma pagamentos</text><rect x="1290" y="150" width="450" height="180" rx="14" fill="white" stroke="#9a6a31" stroke-width="2"/><text x="1312" y="187" style="font-family:Arial,sans-serif;font-size:25px;fill:#9a6a31;font-weight:bold">Notificações</text><text x="1312" y="227" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Recebe avisos financeiros</text><text x="1312" y="257" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Destinatário identificado por User.id</text><text x="1312" y="287" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Aceitação não significa leitura</text><path d="M 560 215 H 690" fill="none" stroke="#526987" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#apiArrow)"/><text x="570" y="198" style="font-family:Arial,sans-serif;font-size:19px;fill:#172b46;font-weight:normal">Identidade</text><path d="M 1160 215 H 1290" fill="none" stroke="#526987" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#apiArrow)"/><text x="1170" y="198" style="font-family:Arial,sans-serif;font-size:19px;fill:#172b46;font-weight:normal">Envia avisos</text><rect x="60" y="455" width="500" height="195" rx="14" fill="white" stroke="#334867" stroke-width="2"/><text x="82" y="492" style="font-family:Arial,sans-serif;font-size:25px;fill:#334867;font-weight:bold">Horários</text><text x="82" y="532" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Sessão: data, sala e docente</text><text x="82" y="562" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Fornece contexto da avaliação</text><text x="82" y="592" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Recebe inscrições confirmadas</text><text x="82" y="622" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Consultar aulas não exige regularidade</text><rect x="690" y="455" width="1050" height="195" rx="14" fill="white" stroke="#6650a3" stroke-width="2"/><text x="712" y="492" style="font-family:Arial,sans-serif;font-size:25px;fill:#6650a3;font-weight:bold">Avaliações · aplica a regra de acesso</text><text x="712" y="532" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Antes de mostrar as notas, consulta o estado financeiro do estudante.</text><text x="712" y="562" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Também solicita taxas e verifica a liquidação para inscrições pagas.</text><text x="712" y="592" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">As notas permanecem guardadas; o bloqueio afecta a consulta pelo estudante.</text><path d="M 820 455 V 330" fill="none" stroke="#526987" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#apiArrow)"/><text x="837" y="380" style="font-family:Arial,sans-serif;font-size:19px;fill:#172b46;font-weight:normal">Consulta regularidade</text><path d="M 1050 330 V 455" fill="none" stroke="#526987" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#apiArrow)"/><text x="1070" y="406" style="font-family:Arial,sans-serif;font-size:19px;fill:#172b46;font-weight:normal">Devolve ACTIVE / BLOCKED</text><path d="M 560 510 H 690" fill="none" stroke="#526987" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#apiArrow)"/><text x="574" y="496" style="font-family:Arial,sans-serif;font-size:19px;fill:#172b46;font-weight:normal">Sessão</text><path d="M 690 600 H 560" fill="none" stroke="#526987" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#apiArrow)"/><text x="570" y="585" style="font-family:Arial,sans-serif;font-size:19px;fill:#172b46;font-weight:normal">Confirmadas</text><path d="M 290 455 V 380 H 710 V 330" fill="none" stroke="#526987" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#apiArrow)"/><text x="65" y="365" style="font-family:Arial,sans-serif;font-size:19px;fill:#172b46;font-weight:normal">Contexto da sessão → Financeiro</text><rect x="60" y="715" width="530" height="150" rx="14" fill="white" stroke="#167c80" stroke-width="2"/><text x="82" y="752" style="font-family:Arial,sans-serif;font-size:25px;fill:#167c80;font-weight:bold">ACTIVE</text><text x="82" y="792" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Permite ao estudante consultar notas.</text><text x="82" y="822" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Mantém as autorizações académicas.</text><rect x="635" y="715" width="530" height="150" rx="14" fill="white" stroke="#b13c43" stroke-width="2"/><text x="657" y="752" style="font-family:Arial,sans-serif;font-size:25px;fill:#b13c43;font-weight:bold">BLOCKED</text><text x="657" y="792" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Impede o estudante de consultar notas.</text><text x="657" y="822" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Não apaga notas nem resultados.</text><rect x="1210" y="715" width="530" height="150" rx="14" fill="white" stroke="#9a6a31" stroke-width="2"/><text x="1232" y="752" style="font-family:Arial,sans-serif;font-size:25px;fill:#9a6a31;font-weight:bold">Falha / timeout</text><text x="1232" y="792" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Verificação temporariamente indisponível.</text><text x="1232" y="822" style="font-family:Arial,sans-serif;font-size:20px;fill:#172b46;font-weight:normal">Não mostrar notas até verificar; tentar de novo.</text><path d="M 325 695 V 715" stroke="#526987" stroke-width="2" marker-end="url(#apiArrow)"/><path d="M 900 695 V 715" stroke="#526987" stroke-width="2" marker-end="url(#apiArrow)"/><path d="M 1475 695 V 715" stroke="#526987" stroke-width="2" marker-end="url(#apiArrow)"/><path d="M 1215 650 V 680 H 325 V 695 M 900 680 V 695 M 1215 680 H 1475 V 695" fill="none" stroke="#526987" stroke-width="2"/><text x="60" y="915" style="font-family:Arial,sans-serif;font-size:22px;fill:#172b46;font-weight:bold">Regra acordada para a modelação; bloqueio na API de Avaliações ainda por implementar.</text><text x="60" y="950" style="font-family:Arial,sans-serif;font-size:21px;fill:#172b46;font-weight:normal">Abaixo: entidades e FK do Financeiro. Os módulos externos não escrevem directamente nestas tabelas.</text><path d="M 60 985 H 1740" stroke="#ccd6e3" stroke-width="2"/><g transform="translate(0 1020)"><style>text{font-family:Arial,sans-serif;fill:#172b46}.title{font-size:32px;font-weight:bold}.sub{font-size:18px;fill:#496078}.field{font-size:15px}.label{font-size:17px;font-weight:bold;paint-order:stroke;stroke:#f4f7fc;stroke-width:7px;stroke-linejoin:round}.head{font-size:22px;font-weight:bold;fill:white}</style><rect width="1800" height="1940" fill="#f4f7fc" /><text x="60" y="55" class="title">Exercício 1 · Gestão Financeira de Estudantes</text><text x="60" y="88" class="sub">SMART CAMPUS / UJAC · Modelo relacional com integração ao Core</text><path d="M 620 230 H 285 V 470" fill="none" stroke="#74839b" stroke-width="2.5" /><text x="305" y="255" class="label">1 → 0..N · estudante</text><path d="M 900 330 V 470" fill="none" stroke="#74839b" stroke-width="2.5" /><text x="918" y="386" class="label">1 → 0..N · estudante / confirma</text><path d="M 1180 230 H 1515 V 470" fill="none" stroke="#74839b" stroke-width="2.5" /><text x="1230" y="255" class="label">1 → 0..N · estudante</text><text x="1230" y="286" class="label">0..1 → 0..N · resolve</text><path d="M 520 656 H 665" fill="none" stroke="#237b77" stroke-width="2.5" /><text x="529" y="640" class="label">1 → 0..N</text><path d="M 285 843 V 924 H 1515 V 870" fill="none" stroke="#237b77" stroke-width="2.5" /><text x="640" y="915" class="label">1 → 0..N · dívida tem pedidos de análise</text><path d="M 285 1030 V 1080" fill="none" stroke="#74839b" stroke-width="2.5" /><text x="305" y="1064" class="label">1 → 0..1</text><path d="M 900 1030 V 1080" fill="none" stroke="#74839b" stroke-width="2.5" /><text x="920" y="1064" class="label">1 → 0..N</text><rect x="620" y="130" width="560" height="184" rx="12" fill="white" stroke="#ccd6e3" /><path d="M 632 130 H 1168 Q 1180 130 1180 142 V 181 H 620 V 142 Q 620 130 632 130" fill="#334867" /><text x="637" y="163" class="head">User · Core</text><text x="635" y="207" class="field">PK        id : String</text><text x="635" y="234" class="field">—         name : String</text><text x="635" y="261" class="field">UQ        email : String</text><text x="635" y="288" class="field">—         role : Role</text><text x="639" y="322" class="sub">Atributos restantes na tabela de atributos.</text><rect x="50" y="470" width="470" height="373" rx="12" fill="white" stroke="#ccd6e3" /><path d="M 62 470 H 508 Q 520 470 520 482 V 521 H 50 V 482 Q 50 470 62 470" fill="#167c80" /><text x="67" y="503" class="head">Debt · Dívida</text><text x="65" " class="field">PK        id : String</text><text x="1295" y="574" class="field">UQ        code : String</text><text x="1295" y="601" class="field">FK        debtId : String</text><text x="1295" y="628" class="field">FK       studentId : String</text><text x="1295" y="655" class="field">—         reason : String</text><text x="1295" y="682" class="field">—         status : AnalysisRequestStatus</text><text x="1295" y="709" class="field">—         slaDueDate : DateTime</text><text x="1295" y="736" class="field">FK       resolvedById : String?</text><text x="1295" y="763" class="field">—         resolvedAt : DateTime?</text><text x="1295" y="790" class="field">—         resolutionNotes : String?</text><text x="1295" y="817" class="field">—         createdAt : DateTime</text><text x="1295" y="844" class="field">—         updatedAt : DateTime</text><rect x="50" y="980" width="470" height="50" rx="10" fill="#e3eaf4" stroke="#aebed2" /><text x="65" y="1011" class="field">User · estudante (mesma entidade Core)</text><rect x="665" y="980" width="470" height="50" rx="10" fill="#e3eaf4" stroke="#aebed2" /><text x="680" y="1011" class="field">User · estudante (mesma entidade Core)</text><rect x="50" y="1080" width="470" height="238" rx="12" fill="white" stroke="#ccd6e3" /><path d="M 62 1080 H 508 Q 520 1080 520 1092 V 1131 H 50 V 1092 Q 50 1080 62 1080" fill="#167c80" /><text x="67" y="1113" class="head">FinancialStatus · Estado</text><text x="65" y="1157" class="field">PK        id : String</text><text x="65" y="1184" class="field">FK / UQ  studentId : String</text><text x="65" y="1211" class="field">—         status : FinancialStatusType</text><text x="65" y="1238" class="field">—         blockedAt : DateTime?</text><text x="65" y="1265" class="field">—         reason : String?</text><text x="65" y="1292" class="field">—         updatedAt : DateTime</text><rect x="665" y="1080" width="470" height="562" rx="12" fill="white" stroke="#ccd6e3" /><path d="M 677 1080 H 1123 Q 1135 >—         correlationId : String?</text><text x="680" y="1400" class="field">—         deliveryStatus : NotificationDeliveryStatus</text><text x="680" y="1427" class="field">UQ        externalNotificationId : String?</text><text x="680" y="1454" class="field">—         attempts : Int</text><text x="680" y="1481" class="field">—         nextAttemptAt : DateTime</text><text x="680" y="1508" class="field">—         lastAttemptAt : DateTime?</text><text x="680" y="1535" class="field">—         sentAt : DateTime?</text><text x="680" y="1562" class="field">—         lastError : String?</text><text x="680" y="1589" class="field">—         lockedUntil : DateTime?</text><text x="680" y="1616" class="field">—         lockToken : String?</text><path d="M 1135 1420 H 1210 V 1647 H 1280" fill="none" stroke="#9a6a31" stroke-width="2.5" stroke-dasharray="9 6" /><text x="1250" y="1515" class="sub">Relação lógica 1:1 após aceitação</text><text x="1250" y="1545" class="sub">Opcional até ao envio · sem FK SQL</text><rect x="1280" y="1580" width="470" height="184" rx="12" fill="#fff8ee" stroke="#9a6a31" /><text x="1295" y="1613" class="field">Notification · módulo externo (proposta)</text><text x="1295" y="1647" class="field">PK   id : String</text><text x="1295" y="1674" class="field">sourceModule : String</text><text x="1295" y="1701" class="field">sourceEventId : String</text><text x="1295" y="1728" class="field">UQ composta: sourceModule + sourceEventId</text><text x="665" y="1695" class="sub">externalNotificationId: referência ao ID externo.</text><text x="665" y="1725" class="sub">SENT = aceite; leitura gerida pelo outro módulo.</text></g></svg></main></html>
